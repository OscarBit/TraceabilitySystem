server {
    listen 80;

    # The SPA and the API are served from the same origin. Everything under
    # /api is proxied to the FastAPI backend; the trailing slash on
    # proxy_pass strips the /api prefix before it reaches the app.
    # Uploaded photos are served by the backend and so travel this path too
    # (/api/uploads/<file>.webp).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Phone photos are several MB; nginx defaults to 1M.
        client_max_body_size 20M;
    }

    # Static files location
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
