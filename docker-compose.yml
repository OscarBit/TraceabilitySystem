version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gemstone_db
    restart: always
    environment:
      MYSQL_DATABASE: gemstone
      MYSQL_USER: gem_user
      MYSQL_PASSWORD: gem_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
