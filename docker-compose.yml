services:
  caddy:
    image: caddy:2-alpine
    container_name: gemstone-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-:80}

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: gemstone-backend
    volumes:
      - gemstone-data:/app/data
      - gemstone-uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/gemstone.db
    restart: always

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
    container_name: gemstone-frontend
    depends_on:
      - backend
    restart: always

volumes:
  gemstone-data:
  gemstone-uploads:
  caddy_data:
  caddy_config:
