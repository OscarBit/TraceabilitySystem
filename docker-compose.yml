version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: gemstone-backend
    ports:
      - "8000:8000"
    volumes:
      - gemstone-data:/app
    environment:
      - DATABASE_URL=sqlite:///./gemstone.db
    restart: always

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gemstone-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  gemstone-data:
