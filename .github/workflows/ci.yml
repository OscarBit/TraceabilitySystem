name: CI Harness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Test with pytest
      working-directory: ./backend
      run: |
        pytest tests/ -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci || npm install
      
    - name: Run linter
      working-directory: ./frontend
      run: npm run lint
      
    - name: Run tests
      working-directory: ./frontend
      run: npm run test -- --run
      
    - name: Test build
      working-directory: ./frontend
      run: npm run build

  docker-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Docker Compose
      run: docker-compose config
      
    - name: Run Backend Integration Tests via Compose
      run: docker-compose -f docker-compose.yml -f docker-compose.test.yml up --build --exit-code-from backend-test
